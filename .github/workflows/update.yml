name: Update Digital Artists

on:
  workflow_dispatch:

jobs:
  update-artists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Etalase (Public)
        uses: actions/checkout@v4

      - name: Checkout Dapur (Private)
        uses: actions/checkout@v4
        with:
          repository: wonpyu/digital-artist-private
          path: digital-artist-private
          token: ${{ secrets.PAT_ARTIST }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: digital-artist-private
        run: npm install

      - name: Install Playwright
        working-directory: digital-artist-private
        run: npx playwright install chromium --with-deps

      - name: Run Scraper
        working-directory: digital-artist-private
        run: node scrape.js

      - name: Move generated file to Etalase
        run: |
          # Copy file hasil generate ke repo publik
          cp -f digital-artist-private/digital-artists.json .

      - name: Commit and Push to Etalase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital-artists.json
          git diff --staged --quiet || git commit -m "Update digital artists data"
          git push
          
